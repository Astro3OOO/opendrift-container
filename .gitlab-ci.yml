stages:
  - build
  - test
  - push

build-image:
  stage: build
  image: docker:latest
  tags:
    - shell
  script:
    - docker build -t opendrift-container .

test-container:
  stage: test
  image: docker:latest
  tags:
    - shell
  script:
    - docker run --rm opendrift-container python -m pytest tests
    - docker run --rm opendrift-container python main.py input_test.json

push-image:
  stage: push
  image: docker:latest
  tags:
    - shell
  script:
    - docker tag opendrift-container 10.142.47.233:80/fc/opendrift-container:slim
    - docker login 10.142.47.233:80 -u="$HARBOR_USER" -p="$HARBOR_PASSWORD"
    - docker push 10.142.47.233:80/fc/opendrift-container:slim